# 主图版式配置 —— 一行一张 panel（占满版面宽 6.30 in）
#
# 为什么一行一张：
#   矢量图缩小时字号等比缩小。字号锚定 7 pt 时，一张 9 in 画布、10 pt 字号的
#   panel 必须显示在 6.30 in 宽处，字号才正好 7 pt，且**比例与原始设计完全一致**。
#   若强行两图并排（各 3.12 in），字号会掉到 3.5 pt —— 正是审稿人抱怨的问题；
#   若按 3.12 in 重出图（缩画布保字号），panel 会被过度放大、标题裁切。
#   因此采用「一行一张 + 超页高自动分页」策略：字号清晰、比例零失真。
#
# panel 顺序依据 docs/panel_mapping_final.md 的映射结果，严格 a→z。


